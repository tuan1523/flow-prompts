name: Build prompts.json

on:
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "images/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build prompts.json
        run: node scripts/build-prompts.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prompts.json
          git diff --cached --quiet || git commit -m "Build prompts.json [skip ci]"
          git push
